spring.application.name=marketsim-backend
server.port=8081

# ===== Base de donnees : MySQL de XAMPP (root sans mot de passe) =====
# La base "marketsim_db" est creee automatiquement au premier lancement.
spring.datasource.url=jdbc:mysql://localhost:3306/marketsim_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Les tables sont creees / mises a jour automatiquement a partir des @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== JWT =====
app.jwt.secret=5PKe5X/y5ypLCsv4R3PJwuqU+XjicvTK/Aljs9yaPijVp2Pwwr7lpiTzj2tkH4DN
app.jwt.expiration-ms=86400000

# ===== CORS : URL du frontend React (Vite) =====
app.cors.allowed-origins=http://localhost:5173

# ===== Compte admin cree au demarrage s'il n'existe pas =====
app.admin.email=admin@marketsim.tn
app.admin.password=admin123

# ===== Assistant IA du module 6 (Claude) =====
# La cle se met dans la variable d'environnement ANTHROPIC_API_KEY (jamais ici, jamais dans Git).
# Sans cle, l'assistant fonctionne en mode hors-ligne.
app.ai.model=claude-opus-5-5

# ===== Registre d'audit des decisions de l'IA (module 6) =====
# Secret qui scelle chaque bloc (HMAC-SHA256). En production : variable d'environnement LEDGER_SECRET.
app.ledger.secret=${LEDGER_SECRET:marketsim-ledger-dev-secret-change-me}
# Les enregistrements en attente sont scelles dans un bloc toutes les 15 s.
app.ledger.seal-interval-ms=15000
# Active les boutons de demonstration "falsifier / restaurer" (a desactiver en production).
app.ledger.demo-tamper=true

# reCAPTCHA v2 (connexion, inscription, mot de passe oublie). Par defaut : cles de TEST officielles de Google
# (la case affiche un avertissement « test » et accepte tout). Production : definir RECAPTCHA_SITE_KEY et RECAPTCHA_SECRET
# (https://www.google.com/recaptcha/admin). Mettre les deux a vide pour desactiver le reCAPTCHA.
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY:6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
app.recaptcha.secret=${RECAPTCHA_SECRET:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
# true = laisser passer si Google est injoignable (demo hors ligne) ; false = refuser (plus sur)
app.recaptcha.fail-open=${RECAPTCHA_FAIL_OPEN:false}

# ===== E-mails reels (SMTP) =====
# Vide = pas d'envoi : les e-mails restent dans la boite d'envoi de l'admin. Pour envoyer pour de vrai,
# mets tes reglages dans main-backend/config/application.properties (ignore par Git, voir l'exemple a cote)
# ou dans les variables d'environnement MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD...
app.mail.smtp.host=${MAIL_HOST:}
app.mail.smtp.port=${MAIL_PORT:587}
app.mail.smtp.username=${MAIL_USERNAME:}
app.mail.smtp.password=${MAIL_PASSWORD:}
# STARTTLS (port 587 / 2525), SSL (port 465) ou NONE
app.mail.smtp.security=${MAIL_SECURITY:STARTTLS}
app.mail.from=${MAIL_FROM:no-reply@marketsim.tn}
app.mail.from-name=MarketSim AI

# ===== Passkeys (WebAuthn : Face ID, empreinte, Windows Hello) =====
# rp-id = nom de domaine du site (sans port). En local : localhost (jamais une adresse IP).
app.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn.rp-name=MarketSim AI
# origines autorisees (adresse exacte du frontend), separees par des virgules
app.webauthn.origins=${WEBAUTHN_ORIGINS:http://localhost:5173}
