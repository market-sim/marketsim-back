spring.application.name=marketsim-backend
server.port=8081

# ===== Base de donnees : MySQL de XAMPP (root sans mot de passe) =====
# La base "marketsim_db" est creee automatiquement au premier lancement.
spring.datasource.url=jdbc:mysql://localhost:3306/marketsim_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Les tables sont creees / mises a jour automatiquement a partir des @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== JWT =====
app.jwt.secret=5PKe5X/y5ypLCsv4R3PJwuqU+XjicvTK/Aljs9yaPijVp2Pwwr7lpiTzj2tkH4DN
app.jwt.expiration-ms=86400000

# ===== CORS : URL du frontend React (Vite) =====
app.cors.allowed-origins=http://localhost:5173

# ===== Compte admin cree au demarrage s'il n'existe pas =====
app.admin.email=admin@marketsim.tn
app.admin.password=admin123

# ===== Assistant IA du module 6 (Claude) =====
# La cle se met dans la variable d'environnement ANTHROPIC_API_KEY (jamais ici, jamais dans Git).
# Sans cle, l'assistant fonctionne en mode hors-ligne.
app.ai.model=claude-opus-5-5

# ===== Registre d'audit des decisions de l'IA (module 6) =====
# Secret qui scelle chaque bloc (HMAC-SHA256). En production : variable d'environnement LEDGER_SECRET.
app.ledger.secret=${LEDGER_SECRET:marketsim-ledger-dev-secret-change-me}
# Les enregistrements en attente sont scelles dans un bloc toutes les 15 s.
app.ledger.seal-interval-ms=15000
# Active les boutons de demonstration "falsifier / restaurer" (a desactiver en production).
app.ledger.demo-tamper=true

# ===== Module 2 : Trading & Gestion du risque =====
# Frais par transaction (0,1 %), appliques a l'ouverture et a la cloture
trading.fee-rate=0.001
# Capital initial d'un compte (reference du rendement total)
trading.initial-capital=100000
# Regles dures de risque (ordre refuse si depassees)
trading.risk.max-position-pct=25
trading.risk.max-symbol-concentration-pct=40
trading.risk.min-cash-reserve-pct=5
trading.risk.max-open-positions=20
# Correlation constante entre actifs pour la VaR parametrique du portefeuille
trading.risk.default-correlation=0.5
# Moteur de declenchement SL / TP / LIMIT / STOP
trading.engine.enabled=true
trading.engine.interval-ms=2000
